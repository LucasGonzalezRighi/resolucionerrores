<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d6efd" />
    <link rel="stylesheet" href="./styles/bootstrap-icons.min.css"/>
    <link rel="stylesheet" href="./styles/bootstrap.min.css"/>
    <link rel="stylesheet" href="./styles/styles.css" />
    <link rel="manifest" href="./manifest.json">
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          // Ruta relativa a propósito: el alcance del service worker queda en
          // la carpeta donde está sw.js, así funciona en cualquier subcarpeta
          // de GitHub Pages sin tocar nada si el repo cambia de nombre.
          navigator.serviceWorker.register('./sw.js').then(function(registration) {
            // Registration was successful
            console.log('ServiceWorker registration successful with scope: ', registration.scope);
          }, function(err) {
            // registration failed :(
            console.log('ServiceWorker registration failed: ', err);
          });
        });
      }
    </script>
    <title>Benasu Stock</title>
  </head>
  <body>
    <header class="app-header">
      <h1><i class="bi bi-upc-scan"></i> Benasu Stock</h1>
      <button class="menu-btn" id="mainMenu" aria-label="Menú"><i class="bi bi-list"></i></button>
    </header>

    <div class="app">
      <div class="scan-zone">
        <div class="controls">
          <div class="section-info">
            <span class="section-label">Sección <strong id="currentSectionSpan">1</strong> / <span id="totalSectionsSpan">1</span></span>

            <button type="button" id="sectionJump" class="btn-section btn-jump"
                    aria-label="Ir a sección" aria-expanded="false" aria-controls="jumpPanel"><i class="bi bi-chevron-down"></i></button>

            <button type="button" id="sectionDelete" class="btn btn-danger btn-section disabled"><i class="bi bi-trash"></i></button>

            <div class="jump-panel" id="jumpPanel" hidden>
              <span class="jump-title">Ir a sección</span>
              <div class="jump-form">
                <input type="number" id="jumpInput" min="1" inputmode="numeric"
                       placeholder="N°" autocomplete="off" aria-label="Número de sección"/>
                <button type="button" id="jumpGo">Ir</button>
              </div>
              <ul class="jump-list" id="jumpList"></ul>
            </div>
          </div>
          <div class="section-buttons">
            <button type="button" id="sectionPlus" class="btn btn-primary btn-section"><i class="bi bi-plus"></i></button>
            <button type="button" id="sectionMinus" class="btn btn-primary btn-section disabled"><i class="bi bi-dash"></i></button>
            <span class="btn-section btn-section-placeholder" aria-hidden="true"></span>
          </div>
        </div>

        <div class="scan-status">
          <p class="scan-ready"><i class="bi bi-broadcast"></i> Listo para escanear</p>
          <button class="btn btn-outline-secondary btn-sm" id="manualEntry" type="button"><i class="bi bi-keyboard"></i> Manual</button>
        </div>
      </div>

      <main class="item-list">
        <table class="table">
          <thead>
            <tr>
              <th scope="col" class="col-edit">Editar</th>
              <th scope="col" class="col-amount">Cant.</th>
              <th scope="col">Código de Barras</th>
            </tr>
          </thead>
          <tbody id="tableBody">

          </tbody>
        </table>
      </main>

      <div class="totals">
        <div class="total-item">
          <span class="total-label px-2">Sección</span>
          <span class="total-value" id="totalItemsSection">0</span>
        </div>
        <div class="total-item">
          <span class="total-label px-2">Total</span>
          <span class="total-value" id="totalItems">0</span>
        </div>
      </div>
    </div>

    <script src="./js/bootstrap.bundle.min.js"></script>
    <script src="./js/sweetalert2.min.js"></script>
    <script src="./js/papaparse.min.js"></script>
    <script src="./js/reader.js"></script>
  </body>
</html>
